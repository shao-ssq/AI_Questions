    项目经历:
      - name: AgentFlywheel（微粒贷营销/催收数据飞轮）
        date: 2026-09
        start_date:
        end_date:
        location:
        summary: 由造数、微调、对话、质检与分析五大 Agent 闭环联动，实现“造数→微调→对话→质检→分析→回流造数”的自演进数据飞轮，持续覆盖新场景并提升营销模型业务表现。
        highlights:
          - 【造数 Agent】基于 DAG + 马尔可夫状态机编排对话流程，[通用模型][用户模型]根据状态交互生成对话，多路径遍历长尾复杂场景。
          - 【微调 Agent】融合【造数 Agent】新场景数据，微调 Qwen3-8B，构建[营销模型]新场景业务能力。
          - 【对话 Agent】[营销模型] vs [用户模型]双模型对弈，注入用户画像&对话路径驱动多轮动态对话。
          - 【质检 Agent】[质检模型] + 多规则并发 + 误判兜底，以人工标注为基准，评估[营销模型] P/R/F1。
          - 【分析 Agent】Badcase 自动聚类 + 根因多维诊断，反向驱动【造数 Agent】定向生成样本。
      - name: DeepReview
        date: 2025-10
        start_date:
        end_date:
        location:
        summary: 基于微调大模型与图谱建模的代码审查 SKILL，通过规则分类体系与 Diff/Code 双通道审查，实现 Review 几乎 0 Token 消耗。
        highlights:
          - 微调：基于 Qwen3.6-27B 微调模型构建代码 Diff/Code 双通道审查；采用 Tree-sitter AST 扩展至函数边界并注入状态和行号上下文；内置 215 条《CNC 开发铁律&金融严谨性》规则分类体系（A 类 123 条可通过单 Diff 判断，B 类 92 条需 SKILL 跨文件/跨表上下文）。
          - 图谱：
          - 审查：
          - 成果：Token 降低 90%+，Review 无需大量 grep 扫描上下文；通用 LLM 精确率仅 50%、误判率 30%，DeepReview 达 95%+ 精确率；已发布 pip 包（deep-review）实现数据飞轮自演进。
      - name: CosyVoice 推理延迟优化与分布式部署
        date: 2025-04
        start_date:
        end_date:
        location:
        summary:
        highlights:
          - 内容：分离式架构防止 LLM 和 token2wav 资源竞争；vLLM & 多 estimator 加速 LLM 推理速度；配套流式输入&输出，提升全流程速度。
          - 成果：4 卡分布式部署下，双流式 24 并发 P99 稳定在 429ms 内；消除流式输入延迟的条件下，TTS 推理 P99 低至 264ms，业界领先。
    论文发表:
      - title: 领导者与协作者：解决多智能体强化学习中的稀疏奖励问题
        authors:
          - '**Shaoqi Sun**'
